<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy BMI & Daily Calories Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #a1c4fd, #c2e9fb);
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .header {
      background: #4a90e2;
      color: white;
      padding: 25px;
      text-align: center;
      font-size: 24px;
    }
    .content {
      padding: 30px;
    }
    label {
      font-weight: bold;
      color: #333;
      display: block;
      margin-top: 20px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      background: #50c878;
      color: white;
      padding: 16px;
      border: none;
      border-radius: 50px;
      font-size: 20px;
      margin-top: 25px;
      cursor: pointer;
    }
    button:hover {
      background: #42b966;
    }
    .result {
      margin-top: 30px;
      padding: 25px;
      background: #f0f8ff;
      border-radius: 15px;
      border: 3px solid #a1c4fd;
      display: none;
      font-size: 18px;
      line-height: 1.8;
    }
    .big { font-size: 50px; font-weight: bold; color: #4a90e2; }
    .good { color: green; font-weight: bold; }
    .warning { color: orange; font-weight: bold; }
    .danger { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <div class="box">
    <div class="header">
      Your Health Calculator<br>
      <small style="font-size:16px;">BMI + How Many Calories You Need Daily</small>
    </div>

    <div class="content">

      <label>Your Age (years)</label>
      <input type="number" id="age" value="30" min="5" max="100">

      <label>Your Gender</label>
      <select id="gender">
        <option>Male</option>
        <option>Female</option>
      </select>

      <label>Your Height</label>
      <input type="number" id="height" placeholder="Example: 170" step="1">
      <select id="heightUnit">
        <option value="cm">Centimeters (cm)</option>
        <option value="ft">Feet (e.g. 5.9)</option>
      </select>

      <label>Your Weight</label>
      <input type="number" id="weight" placeholder="Example: 70" step="0.5">
      <select id="weightUnit">
        <option value="kg">Kilograms (kg)</option>
        <option value="lbs">Pounds (lbs)</option>
      </select>

      <label>How Active Are You?</label>
      <select id="activity">
        <option value="1.2">Not active (sit most of the day)</option>
        <option value="1.375">Light exercise (1–3 days/week)</option>
        <option value="1.55">Moderate exercise (3–5 days/week)</option>
        <option value="1.725">Very active (6–7 days/week)</option>
        <option value="1.9">Super active (athlete or hard physical job)</option>
      </select>

      <button onclick="calculateEasy()">Show My Results</button>

      <div id="result" class="result">
        <h2 style="text-align:center; color:#4a90e2;">Your Health Report</h2>

        <p><strong>Your BMI is:</strong> <span class="big" id="bmi">0</span></p>
        <p><strong>Your weight status:</strong> <span id="status">---</span></p>
        <p id="bmiMessage"></p>

        <hr style="border:1px dashed #aaa; margin:25px 0;">

        <p><strong>You need about:</strong> <span class="big" id="calories">0</span> calories per day</span></p>
        <p>→ To <strong>stay the same weight</strong>: <span id="maintain">0</span> calories</p>
        <p>→ To <strong>lose 0.5 kg per week</strong>: <span id="lose">0</span> calories</p>
        <p>→ To <strong>gain 0.5 kg per week</strong>: <span id="gain">0</span> calories</p>
      </div>
    </div>
  </div>

<script>
function calculateEasy() {
  // Get values
  let age = parseInt(document.getElementById("age").value);
  let gender = document.getElementById("gender").value;
  let height = parseFloat(document.getElementById("height").value);
  let weight = parseFloat(document.getElementById("weight").value);
  let heightUnit = document.getElementById("heightUnit").value;
  let weightUnit = document.getElementById("weightUnit").value;
  let activity = parseFloat(document.getElementById("activity").value);

  // Basic check
  if (!age || !height || !weight) {
    alert("Please fill in all the information");
    return;
  }

  // Convert height to meters
  if (heightUnit === "ft") height = height * 0.3048;  // feet → meters
  else height = height / 100;  // cm → meters

  // Convert weight to kg
  if (weightUnit === "lbs") weight = weight * 0.453592;  // lbs → kg

  // Calculate BMI
  let bmi = (weight / (height * height)).toFixed(1);

  // BMI message based on age
  let status = "";
  let message = "";
  let colorClass = "";

  if (age < 18) {
    if (bmi < 15) { status = "Too Thin"; message = "You are very thin for your age. Eat more healthy food."; colorClass = "warning"; }
    else if (bmi < 24) { status = "Healthy Weight"; message = "Perfect! You are at a good weight."; colorClass = "good"; }
    else if (bmi < 30) { status = "A Bit Heavy"; message = "Try to play more and eat healthy."; colorClass = "warning"; }
    else { status = "Too Heavy"; message = "Talk to a doctor to get healthier."; colorClass = "danger"; }
  }
  else if (age >= 65) {
    if (bmi < 23) { status = "A Bit Thin"; message = "For seniors, it's better to have a little extra weight."; colorClass = "warning"; }
    else if (bmi < 30) { status = "Good Weight"; message = "Great! You are in a healthy range for your age."; colorClass = "good"; }
    else { status = "Overweight"; message = "Losing a little weight slowly can help your joints and heart."; colorClass = "warning"; }
  }
  else {
    // Normal adult
    if (bmi < 18.5) { status = "Underweight"; message = "You are thinner than recommended. Try eating more."; colorClass = "warning"; }
    else if (bmi < 25) { status = "Perfect Weight"; message = "Excellent! You are healthy."; colorClass = "good"; }
    else if (bmi < 30) { status = "Overweight"; message = "A little exercise and healthy food will help."; colorClass = "warning"; }
    else { status = "Obese"; message = "It's important to lose weight slowly for better health."; colorClass = "danger"; }
  }

  // Calculate daily calories (simple & accurate formula)
  let bmr;
  if (gender === "Male") {
    bmr = 10 * weight + 6.25 * (height * 100) - 5 * age + 5;
  } else {
    bmr = 10 * weight + 6.25 * (height * 100) - 5 * age - 161;
  }

  let dailyCalories = Math.round(bmr * activity);

  // Show results
  document.getElementById("bmi").innerText = bmi;
  document.getElementById("status").innerText = status;
  document.getElementById("status").className = colorClass;
  document.getElementById("bmiMessage").innerText = message;

  document.getElementById("calories").innerText = dailyCalories.toLocaleString();
  document.getElementById("maintain").innerText = dailyCalories.toLocaleString();
  document.getElementById("lose").innerText = (dailyCalories - 500).toLocaleString();
  document.getElementById("gain").innerText = (dailyCalories + 500).toLocaleString();

  document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
