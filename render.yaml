services:
  # 1. Python 3.10 Machine Learning Microservice
  - type: web
    name: arogya-ml-service
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 10000

  # 2. Node.js Full-Stack Web Service (Serves Express API + Built React Client)
  - type: web
    name: arogya-kavaj-web
    runtime: node
    rootDir: .
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: arogya-ml-service
          property: host
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
